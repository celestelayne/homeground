name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    # Matches the PostgreSQL major version run locally via Postgres.app.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homeground
          POSTGRES_PASSWORD: homeground
          POSTGRES_DB: homeground
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homeground -d homeground"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://homeground:homeground@localhost:5432/homeground

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run typecheck

      - name: Migrate
        run: pnpm --filter @homeground/api db:migrate

      - name: Tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
